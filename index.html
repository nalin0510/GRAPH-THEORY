<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      (function () {
        function isExtensionNoise(msg, stack, filename) {
          var s = String(stack || '');
          var m = String(msg || '');
          var f = String(filename || '');
          return (
            f.indexOf('chrome-extension://') === 0 ||
            f.indexOf('moz-extension://') === 0 ||
            f.indexOf('safari-extension://') === 0 ||
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            s.indexOf('safari-extension://') !== -1 ||
            m.indexOf('Failed to connect to MetaMask') !== -1
          );
        }
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var r = event && event.reason;
            var msg = r && r.message ? r.message : r;
            var stack = r && r.stack ? r.stack : '';
            if (isExtensionNoise(msg, stack, '')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (event) {
            var err = event && event.error;
            if (
              isExtensionNoise(
                (event && event.message) || (err && err.message),
                err && err.stack,
                event && event.filename
              )
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        var prevConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            if (
              isExtensionNoise(
                a && a.message ? a.message : a,
                a && a.stack ? a.stack : '',
                ''
              )
            ) {
              return;
            }
          }
          return prevConsoleError.apply(console, arguments);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteVerse — Navigate Smarter. Master the Graph.</title>
    <meta
      name="description"
      content="RouteVerse combines interactive smart navigation, Dijkstra's, Prim's, and Kruskal's algorithm visualizations, and graph theory strategy games."
    />
    <meta property="og:title" content="RouteVerse — Navigate Smarter. Master the Graph." />
    <meta

      content="Interactive navigation command centre, graph algorithm visualizer, and strategy games for Dijkstra's, Prim's, and Kruskal's algorithms."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      rel="stylesheet"
    />
  </head>
